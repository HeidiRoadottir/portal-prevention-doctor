<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Doktor Portal interaction model</title>
  <desc id="desc">Model showing input, bodily action, bodily impact, computational action and output for the Doktor Portal installation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d1d1"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4"/>
      <feOffset dx="0" dy="1" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- Main installation band -->
  <rect x="66" y="242" width="1068" height="155" rx="78" fill="#ebe7e2"/>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#333333">[ Doktor Portal installation ]</text>

  <!-- Input and output nodes -->
  <ellipse cx="122" cy="319" rx="80" ry="78" fill="#eee9e4"/>
  <circle cx="122" cy="319" r="65" fill="#c8bbb2"/>
  <text x="122" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2e2e2e">INPUT</text>
  <text x="122" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4d4d4d">stemme + knap</text>

  <ellipse cx="1038" cy="319" rx="80" ry="78" fill="#eee9e4"/>
  <circle cx="1038" cy="319" r="65" fill="#c8bbb2"/>
  <text x="1038" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2e2e2e">OUTPUT</text>
  <text x="1038" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4d4d4d">tale + print</text>

  <!-- Bodily upper shapes -->
  <ellipse cx="426" cy="119" rx="170" ry="85" fill="#f3eaea" opacity="0.95"/>
  <rect x="548" y="26" width="260" height="175" rx="76" fill="#eadfdd" opacity="0.95"/>
  <ellipse cx="575" cy="116" rx="82" ry="93" fill="#dfd1cf" opacity="0.32"/>

  <text x="337" y="109" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222">BODILY ACTION</text>
  <text x="337" y="136" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="italic" fill="#222222">Bodily behaviour</text>
  <text x="337" y="165" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4d4d4d">taler, trykker, står foran robotten</text>

  <text x="587" y="109" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222">BODILY IMPACT</text>
  <text x="587" y="136" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="italic" fill="#222222">Bodily experience</text>
  <text x="587" y="165" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4d4d4d">bliver screenet, vurderet og mødt</text>

  <!-- Computational lower shape -->
  <rect x="364" y="459" width="430" height="130" rx="68" fill="#d7d8e6"/>
  <text x="579" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222">COMPUTATIONAL ACTION</text>
  <text x="579" y="557" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4d4d4d">tale til tekst, AI, server, Arduino</text>

  <!-- Arrows -->
  <path d="M 246 106 C 170 98, 93 100, 68 116 C 50 128, 49 194, 66 232" fill="none" stroke="#d1d1d1" stroke-width="17" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M 82 397 L 82 492 C 82 525, 196 533, 292 517" fill="none" stroke="#d1d1d1" stroke-width="17" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M 814 526 L 963 526 C 1016 526, 1021 463, 1021 416" fill="none" stroke="#d1d1d1" stroke-width="17" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M 1034 225 C 1039 151, 1031 112, 1010 105 C 976 94, 918 98, 858 108" fill="none" stroke="#d1d1d1" stroke-width="17" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <!-- Material labels -->
  <text x="1065" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">BODILY</text>
  <text x="1065" y="132" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">MATERIAL</text>
  <text x="1065" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">TANGIBLE</text>
  <text x="1065" y="223" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">MATERIAL</text>
  <text x="1065" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">COMPUTATIONAL</text>
  <text x="1065" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#595959">MATERIAL</text>

  <!-- Small explanatory notes -->
  <text x="600" y="631" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#555555">
    Tangible material: CNC-fræset trækasse, jernstang, akryl, knap, mikrofon, højtaler, printer og robothoved
  </text>
</svg>
